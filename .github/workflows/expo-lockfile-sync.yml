name: Refresh Expo lockfile (temporary)

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/expo-lockfile-sync.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Resolve SDK patch versions into npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile directly to main
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "::error::Expected package-lock.json update not generated"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync Expo SDK 57 patch lockfile"
          git push origin HEAD:main
