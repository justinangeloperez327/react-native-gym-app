name: One-time Expo patch lockfile refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-expo-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Update npm lockfile for Expo SDK compatibility
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock compatible Expo 57 patch releases"
            git push
          fi
