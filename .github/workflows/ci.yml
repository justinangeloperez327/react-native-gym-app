name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Validate native release profiles
        run: npm run check:release-config
      - name: Expo SDK dependency compatibility
        run: npm run check:expo
      - name: Inspect evaluated Android/iOS native configuration
        run: |
          npx expo config --type introspect --json > /tmp/gym-expo-introspection.json
          npm run check:native-config -- /tmp/gym-expo-introspection.json
      - name: Bundle production JavaScript for Android and iOS
        run: npx expo export --platform all --output-dir /tmp/gym-ci-bundles
